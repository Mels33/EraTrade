# Локальное окружение EraTrade: только PostgreSQL.
# Порт 5435, чтобы не конфликтовать с другими локальными Postgres.
services:
  postgres:
    image: postgres:17
    container_name: eratrade-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: eratrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eratrade_local}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - eratrade_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eratrade -d eratrade_testnet"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Коллектор рыночных данных mainnet: только чтение публичных данных, режим DISABLED, без ключей.
  # Запуск: docker-compose --profile collector up -d --build
  collector-mainnet:
    build: .
    container_name: eratrade-collector-mainnet
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.mainnet
    environment:
      DATABASE_URL: postgresql+asyncpg://eratrade:${POSTGRES_PASSWORD:-eratrade_local}@postgres:5432/eratrade_mainnet
      ERATRADE_ENV_FILE: /nonexistent
    entrypoint: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/eratrade collect"]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Периодическая сверка с биржей (§11 плана): раз в минуту. Ключ API-кошелька не нужен —
  # только чтение биржи; критичное расхождение блокирует входы и ставит LIVE_PAUSED.
  reconciler-mainnet:
    build: .
    container_name: eratrade-reconciler-mainnet
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.mainnet
    environment:
      DATABASE_URL: postgresql+asyncpg://eratrade:${POSTGRES_PASSWORD:-eratrade_local}@postgres:5432/eratrade_mainnet
      ERATRADE_ENV_FILE: /nonexistent
    entrypoint: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/eratrade reconcile --every 60"]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Mainnet shadow (§16.4): сигналы на каждую закрытую свечу без ключа API-кошелька.
  # Артефакты моделей — из ./models (только чтение).
  shadow-mainnet:
    build: .
    container_name: eratrade-shadow-mainnet
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.mainnet
    environment:
      DATABASE_URL: postgresql+asyncpg://eratrade:${POSTGRES_PASSWORD:-eratrade_local}@postgres:5432/eratrade_mainnet
      ERATRADE_ENV_FILE: /nonexistent
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    entrypoint: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/eratrade shadow"]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # API и панель управления (§13). Порт опубликован только на 127.0.0.1.
  # Ключ API-кошелька нужен только для cancel-all/flatten/kill; открыть позицию через API нельзя.
  api-mainnet:
    build: .
    container_name: eratrade-api-mainnet
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env.mainnet, .env.mainnet.secrets]
    environment:
      DATABASE_URL: postgresql+asyncpg://eratrade:${POSTGRES_PASSWORD:-eratrade_local}@postgres:5432/eratrade_mainnet
      ERATRADE_ENV_FILE: /nonexistent
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/eratrade api --host 0.0.0.0 --allow-external"]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Ежедневные бэкапы обеих БД в ./backups (хранение 14 дней).
  pg-backup:
    image: postgres:17
    container_name: eratrade-pg-backup
    profiles: ["collector"]
    restart: unless-stopped
    user: "1000:1000"  # файлы бэкапов принадлежат пользователю, а не root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-eratrade_local}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/backup-loop.sh"]

volumes:
  eratrade_pg_data:
