# Торговая и риск-спецификация EraTrade. Описание: docs/spec.md
# Денежные и дробные значения записаны строками, чтобы читаться как Decimal без потерь.

spec_version = 1

[market]
coin = "BTC"
interval = "1h"
horizon_candles = 4
margin_mode = "isolated"
leverage = 2

[policy]
allow_long = true
allow_short = true
allow_reversal = false
time_exit_candles = 8
reentry_cooldown_candles = 1

[sizing]
fixed_risk_usdc = "10"
risk_fraction = "0.005"          # 0.5% equity
stop_atr_period = 14
stop_atr_multiplier = "1.5"
min_stop_distance_fraction = "0.005"  # 0.5% цены
min_order_notional_usdc = "10"

[limits]
max_position_notional_usdc = "20"  # технические тесты на mainnet; 200 — после этапа 14
max_leverage = 2
max_daily_loss_fraction = "0.02"   # 2% equity
max_weekly_loss_fraction = "0.05"  # 5% equity
max_trades_per_day = 4
max_spread_bps = "5"
max_slippage_bps = "10"

[freshness]
max_decision_delay_seconds = 90
max_ws_silence_seconds = 30
max_unknown_order_seconds = 30

[execution]
# Лимит stop-market ордера: на столько хуже цены срабатывания (худшая допустимая цена исполнения).
stop_market_slippage_bps = "500"
# Каждый ордер подтверждается оператором вручную (этапы 6–8, решение без testnet).
require_manual_confirmation = true

[risk]
# Нереализованный PnL открытой позиции входит в дневной/недельный убыток (консервативно, §12.3).
loss_includes_unrealized = true
# Предупреждение, когда у адреса остаётся мало запросов (address-based rate limit).
address_requests_warning = 1000

[dead_mans_switch]
# scheduleCancel отменяет ВСЕ открытые ордера, а у нас единственные стоящие ордера — защитные
# стопы (входы — IOC). Включённый switch при падении бота снял бы защиту с позиции, поэтому
# по умолчанию выключен. Имеет смысл, только если появятся лимитные входы (GTC/ALO).
enabled = false
horizon_seconds = 120
refresh_seconds = 30

[target]
# Разметка обучающего набора (docs/spec.md §8). Горизонт — market.horizon_candles.
# UP: доходность за горизонт > порога; DOWN: < -порога; иначе FLAT.
# Порог = издержки туда-обратно + запас + минимальный край.
taker_fee_bps = "4.5"          # taker-комиссия базового уровня, за сторону
expected_spread_bps = "1"      # спред BTC, один раз за сделку
expected_slippage_bps = "2"    # за сторону (лимит — limits.max_slippage_bps)
expected_funding_bps = "0.5"   # ~0.00125%/ч × 4 ч
safety_margin_bps = "5"
min_edge_bps = "20"
