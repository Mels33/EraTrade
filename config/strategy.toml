# Конфигурация EraTrade: маркет-мейкинг на Hyperliquid.
spec_version = 2

[mm]
# Маркет-мейкинг: котировки post-only (ALO) с обеих сторон стакана на монетах со спредом шире
# комиссии maker (1.5 bp × 2). Котирует только в режиме LIVE_ENABLED и без запрета входов.
coins = ["FARTCOIN", "VVV"]   # стартовые монеты; при auto_select бот выбирает сам
auto_select = true          # раз в rescan_minutes выбирать лучшие монеты сканером
max_coins = 2
rescan_minutes = 180
select_min_spread_bps = 5   # медианный спред кандидата (запас над порогом котирования)
select_max_spread_bps = 30  # шире — «мёртвый» рынок с резкими скачками
select_min_volume_usd = 2000000
select_hysteresis = 0.3     # заменить текущую монету, только если кандидат лучше на 30%
exclude = []                # монеты, которые никогда не торговать
retire_flatten_minutes = 60 # уходим с монеты: столько ждём закрытия позиции заявкой, потом по рынку
order_usd = 12              # размер заявки (биржевой минимум 10 USDC)
max_inventory_usd = 25      # предел позиции по монете в любую сторону
daily_loss_usd = 2          # реализованный + нереализованный PnL за сутки UTC → стоп, закрыть, запрет
leverage = 3                # isolated
min_spread_bps = 4          # уже — не котировать
improve_min_ticks = 3       # спред ≥ N шагов цены → встать на шаг лучше лучшей цены
flow_window_seconds = 30    # окно потока агрессивных сделок
flow_min_usd = 1000         # меньше оборота в окне — поток не учитывается
flow_pull_imbalance = 0.6   # |покупки − продажи| / сумма ≥ порога → снять сторону против потока
requote_min_interval_seconds = 3
max_actions_per_minute = 12 # заявки/отмены/перестановки (лимит запросов адреса)
min_requests_remaining = 20000
stale_book_seconds = 10     # стакан не обновлялся дольше — снять котировки
sync_seconds = 5            # сверка позиции и заявок с биржей
dms_horizon_seconds = 120   # scheduleCancel: биржа снимет заявки, если процесс завис/упал
dms_refresh_seconds = 60

